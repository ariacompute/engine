name: Publish PyPI (ariaengine)

# Build platform wheels via cibuildwheel (manylinux x86_64/aarch64, macOS
# arm64, Windows x86_64) and upload to PyPI as owner `ariacompute`.
# Note: the macOS x86_64 wheel was dropped — macos-13 is the only GitHub
# hosted Intel macOS runner and its queue can stall for hours in 2026.
#
# Secrets required:
#   PYPI_TOKEN  — PyPI API token (project-scoped for ariaengine, Owner role)

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: tag with v stripped)"
        required: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            arch: x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            os: macos-14
            arch: arm64
          - name: windows-amd64
            os: windows-latest
            # Windows accepts AMD64/ARM64/x86 only (x86_64 is a Linux alias)
            arch: AMD64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Inject version into pyproject.toml
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          # release event: GITHUB_REF_NAME is the tag (e.g. v0.2.0 -> 0.2.0)
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # manual dispatch without a version: fall back to the newest tag
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          # -i.bak works on both GNU sed (linux/windows git-bash) and BSD sed (macOS)
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" bindings/python/pyproject.toml
          rm -f bindings/python/pyproject.toml.bak
          echo "Publishing version=$VERSION"
      - uses: pypa/cibuildwheel@v2.23.2
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BEFORE_ALL: bash scripts/build-python-ffi.sh
          # env var is authoritative (mirrors [tool.cibuildwheel] skip in
          # bindings/python/pyproject.toml): musl targets drop the cdylib
          # crate type, so musllinux wheels cannot bundle libariaengine_ffi.so.
          # The pattern must be "*musllinux*" (fnmatch on the full
          # identifier like cp310-musllinux_x86_64); quoted because it
          # starts with an asterisk in YAML.
          CIBW_SKIP: "*musllinux*"
        with:
          package-dir: bindings/python
          output-dir: wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: wheelhouse/*.whl

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Twine check + upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install --upgrade pip twine
          ls -la dist
          twine check dist/*.whl
          twine upload dist/*.whl
