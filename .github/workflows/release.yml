name: Release

on:
  release:
    types:
      - created

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: aria-engine

jobs:
  build:
    name: Build & Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            asset_os: linux_x86_64
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            asset_os: windows_x86_64
            archive: zip
          - name: linux-arm64
            os: ubuntu-24.04-arm
            asset_os: linux_arm64
            archive: tar.gz
          - name: macos
            os: macos-latest
            asset_os: macos
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release binary
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Embed release tag (sans leading v) into aria-engine -v/--version.
          export ARIA_ENGINE_VERSION="${TAG_NAME#v}"
          echo "ARIA_ENGINE_VERSION=$ARIA_ENGINE_VERSION"
          cargo build --release -p aria-openai

      - name: Package release archive (Unix)
        if: matrix.archive == 'tar.gz'
        shell: bash
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          ARCHIVE_NAME="engine_${VERSION}_${ASSET_OS}.tar.gz"
          tar -czf "$ARCHIVE_NAME" -C target/release "$BIN_NAME"
          echo "ASSET_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Package release archive (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
          ASSET_OS: ${{ matrix.asset_os }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $archiveName = "engine_${version}_$($env:ASSET_OS).zip"
          Compress-Archive -Path "target/release/$($env:BIN_NAME).exe" -DestinationPath $archiveName -Force
          Add-Content -Path $env:GITHUB_ENV -Value "ASSET_PATH=$archiveName"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ env.ASSET_PATH }}
          token: ${{ secrets.ARIACOMPUTE_TOKEN }}

  # Language package publishes are fail-pass: must not block CLI/assets.
  publish-packages:
    name: Publish language packages (fail-pass)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release libaria_ffi
        run: |
          cargo build --release -p aria-ffi
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          tar -czf "libaria_ffi_${VERSION}_linux_x86_64.tar.gz" -C target/release libaria_ffi.so || \
            tar -czf "libaria_ffi_${VERSION}_linux_x86_64.tar.gz" -C target/release libaria_ffi.a
      - name: Upload libaria_ffi asset
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: libaria_ffi_*.tar.gz
          token: ${{ secrets.ARIACOMPUTE_TOKEN }}
      - name: npm @ariacompute/engine-ts
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm version "${VERSION}" --no-git-tag-version || true
          npm publish --access public || echo "npm engine-ts publish failed (fail-pass)"
      - name: npm @ariacompute/engine-rn
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/react-native
          npm version "${VERSION}" --no-git-tag-version || true
          npm publish --access public || echo "npm engine-rn publish failed (fail-pass)"
      - name: pub.dev Flutter
        continue-on-error: true
        run: |
          echo "Configure PUB_CREDENTIALS secret then: cd bindings/flutter && dart pub publish --force"
          echo "pub.dev publish stub (fail-pass)"
      - name: Maven Kotlin
        continue-on-error: true
        run: |
          echo "Configure Maven Central / GPG then: cd bindings/kotlin && ./gradlew publish"
          echo "Maven publish stub (fail-pass)"
      - name: CocoaPods Swift
        continue-on-error: true
        run: |
          echo "Configure COCOAPODS_TRUNK_TOKEN then: pod trunk push bindings/swift/AriaEngine.podspec"
          echo "CocoaPods publish stub (fail-pass)"
      - name: crates.io aria-engine
        continue-on-error: true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo publish -p aria-engine --dry-run || true
          cargo publish -p aria-engine || echo "crates.io publish failed (fail-pass)"
      - name: PyPI aria-engine
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          cd bindings/python
          pip install build twine || true
          python -m build || true
          twine upload dist/* || echo "PyPI publish failed (fail-pass)"
