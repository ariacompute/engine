name: Publish CocoaPods (AriaEngine)

# Push bindings/swift/AriaEngine.podspec to CocoaPods trunk.
# Requires XCFramework attached in the pod / Release assets.
#
# Secrets:
#   COCOAPODS_TRUNK_TOKEN — from `pod trunk register` / trunk me

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: tag with v stripped)"
        required: false

jobs:
  publish:
    name: CocoaPods AriaEngine
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version=$VERSION"
      - name: Inject version into podspec
        run: |
          sed -i.bak "s/s.version.*=.*/s.version          = '$VERSION'/" bindings/swift/AriaEngine.podspec
          rm -f bindings/swift/AriaEngine.podspec.bak
          grep version bindings/swift/AriaEngine.podspec
      - name: pod trunk push
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::error::COCOAPODS_TRUNK_TOKEN secret is empty"
            exit 1
          fi
          gem install cocoapods -N
          pod trunk push bindings/swift/AriaEngine.podspec --allow-warnings
