name: Publish npm (@ariacompute/ariaengine-ts, @ariacompute/ariaengine-rn)

# Publish the TypeScript SDK (@ariacompute/ariaengine-ts) and the React Native
# binding (@ariacompute/ariaengine-rn) to npmjs.com under the `ariacompute`
# account. engine-ts is built (npm ci + tsc) before publishing so the
# `files: ["dist"]` package is not empty; engine-rn is plain JS and ships
# src/ directly. Version is injected from the release tag via
# `npm version --no-git-tag-version` (no git tag, no repo write-back).
# Publish failures are hard failures (no continue-on-error); republishing
# an existing version fails with npm 409 — bump the tag to re-release.
#
# Secrets required:
#   NPM_TOKEN — npmjs.com token for ~ariacompute with publish permission
#               on @ariacompute/ariaengine-ts and @ariacompute/ariaengine-rn
#               (granular access token, bypass 2FA for automation)

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (default: tag with v stripped)"
        required: false

jobs:
  engine-ts:
    name: npm @ariacompute/ariaengine-ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          # release event: GITHUB_REF_NAME is the tag (e.g. v0.2.0 -> 0.2.0)
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # manual dispatch without a version: fall back to the newest tag
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version=$VERSION"
      - name: Build (tsc)
        run: |
          cd bindings/typescript
          npm ci
          npm run build
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/typescript
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public

  engine-rn:
    name: npm @ariacompute/ariaengine-rn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - name: Resolve version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          # release event: GITHUB_REF_NAME is the tag (e.g. v0.2.0 -> 0.2.0)
          if [ -z "$VERSION" ] && [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          # manual dispatch without a version: fall back to the newest tag
          if [ -z "$VERSION" ]; then
            VERSION="$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')"
          fi
          [ -n "$VERSION" ] || VERSION="0.0.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version=$VERSION"
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          cd bindings/react-native
          npm version "$VERSION" --no-git-tag-version
          npm publish --access public
