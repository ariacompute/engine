[workspace]
resolver = "2"
members = [
    "kernel",
    "graph",
    "inference",
    "hybrid",
    "openai",
    "ffi",
    "bindings/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aria Compute"]

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
indicatif = "0.17"
tempfile = "3"
aria-kernel = { path = "kernel" }
aria-graph = { path = "graph" }
aria-inference = { path = "inference" }
aria-hybrid = { path = "hybrid" }
aria-ffi = { path = "ffi" }
