[workspace]
resolver = "2"
members = [
    "kernel",
    "graph",
    "inference",
    "openai",
    "ffi",
    "bindings/rust",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aria Compute"]
repository = "https://github.com/ariacompute/engine"

[workspace.dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
half = "2"
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
indicatif = "0.17"
tempfile = "3"
rayon = "1.10"
libloading = "0.8"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ariacompute-kernel = { path = "kernel", version = "0.1.0" }
ariacompute-graph = { path = "graph", version = "0.1.0" }
ariacompute-inference = { path = "inference", version = "0.1.0" }
ariacompute-ffi = { path = "ffi", version = "0.1.0" }
clap = { version = "4.5", features = ["derive"] }
