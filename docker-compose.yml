# CPU deployment for Aria Engine (System One inference).
#
#   cp .env.example .env   # adjust SITE_URL / tokens / COMPUTE
#   docker compose build
#   docker compose up -d
#
# For GPU, layer the CUDA override instead:
#   docker compose -f docker-compose.yml -f docker-compose.cuda.yml up -d
#
# Both services bind-mount the host ARIA_DATA_DIR (default ~/.ariacompute) to
# /data/aria, so the engine.yml (config) and models/ (checkpoints) you already
# downloaded on the host are used directly — offline, no download needed. Set
# AUTO_DOWNLOAD=1 only when the Hub (HuggingFace / ModelScope) is reachable and
# you want weights fetched on first run.

services:
  engine-encoder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_IMAGE: ${BUILD_IMAGE:-rust:1-slim}
        FEATURES: ${FEATURES:-}
        ARIA_ENGINE_VERSION: ${ARIA_ENGINE_VERSION:-}
    image: ${ENGINE_IMAGE:-aria-engine:latest}
    restart: unless-stopped
    environment:
      TRACK: encoder
      MODEL: ${ENCODER_MODEL:-}
      PORT: ${ENCODER_PORT:-8010}
      COMPUTE: ${COMPUTE:-auto}
      ARIA_COMPUTE_HOME: /data/aria
      SITE_URL: ${SITE_URL:-}
      UPGRADE_URL: ${UPGRADE_URL:-}
      HF_TOKEN: ${HF_TOKEN:-}
      MODELSCOPE_API_TOKEN: ${MODELSCOPE_API_TOKEN:-}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-0}
      RUST_LOG: ${RUST_LOG:-info}
      # Proxy passthrough (optional). For a host-local proxy, point these at
      # http://host.docker.internal:<port> (mapped to the host gateway above).
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - "${ARIA_DATA_DIR:-/home/lemonjia/.ariacompute}:/data/aria"
    # Lets a host-local proxy (e.g. 127.0.0.1:7897) be reached from the
    # container via http://host.docker.internal:<port> (set in .env).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ENCODER_PORT:-8010}:8010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8010/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  engine-decoder:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_IMAGE: ${BUILD_IMAGE:-rust:1-slim}
        FEATURES: ${FEATURES:-}
        ARIA_ENGINE_VERSION: ${ARIA_ENGINE_VERSION:-}
    image: ${ENGINE_IMAGE:-aria-engine:latest}
    restart: unless-stopped
    environment:
      TRACK: decoder
      MODEL: ${DECODER_MODEL:-}
      PORT: ${DECODER_PORT:-8011}
      COMPUTE: ${COMPUTE:-auto}
      ARIA_COMPUTE_HOME: /data/aria
      SITE_URL: ${SITE_URL:-}
      UPGRADE_URL: ${UPGRADE_URL:-}
      HF_TOKEN: ${HF_TOKEN:-}
      MODELSCOPE_API_TOKEN: ${MODELSCOPE_API_TOKEN:-}
      AUTO_DOWNLOAD: ${AUTO_DOWNLOAD:-0}
      RUST_LOG: ${RUST_LOG:-info}
      # Proxy passthrough (optional). For a host-local proxy, point these at
      # http://host.docker.internal:<port> (mapped to the host gateway above).
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      http_proxy: ${http_proxy:-}
      https_proxy: ${https_proxy:-}
      no_proxy: ${no_proxy:-}
    volumes:
      - "${ARIA_DATA_DIR:-/home/lemonjia/.ariacompute}:/data/aria"
    # Lets a host-local proxy (e.g. 127.0.0.1:7897) be reached from the
    # container via http://host.docker.internal:<port> (set in .env).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DECODER_PORT:-8011}:8011"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8011/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
