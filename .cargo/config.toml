# candle → gemm emits aarch64 half-precision NEON asm (fmla/fmul .8h).
# The default aarch64-unknown-linux-gnu rustc target does not enable +fp16,
# so LLVM rejects the inline asm with "instruction requires: fullfp16"
# (seen on GitHub ubuntu-24.04-arm / linux-arm64 release builds).
# Runtime paths in gemm remain feature-gated; this only unblocks assembly.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+fp16,+fhm"]
