[package]
name = "ariacompute-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for Aria engine (thin wrapper over ariacompute-inference / ariacompute-ffi)"
readme = "README.md"
keywords = ["aria", "llm", "inference"]
categories = ["api-bindings"]

[lib]
name = "aria_engine"

[dependencies]
ariacompute-inference = { workspace = true }
ariacompute-ffi = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
ureq = { version = "2", features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
