[package]
name = "ariacompute-ariaengine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust SDK for Aria engine (thin wrapper over ariaengine-inference / ariacompute-ariaengine-ffi)"
readme = "README.md"
keywords = ["aria", "llm", "inference"]
categories = ["api-bindings"]

[lib]
name = "ariaengine"

[dependencies]
ariaengine-inference = { workspace = true }
ariacompute-ariaengine-ffi = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "2", features = ["tls"] }
thiserror = { workspace = true }
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = { workspace = true }
