import com.vanniktech.maven.publish.SonatypeHost
import org.gradle.plugins.signing.Sign

plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.0.21'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

group = 'com.ariacompute'
version = System.getenv('ARIA_VERSION') ?: '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    jvmToolchain(17)
}

// Maven Central (Central Portal) publishing via vanniktech plugin.
// Sonatype credentials come from ORG_GRADLE_PROJECT_mavenCentralUsername/Password.
// The GPG key MUST come from GPG_PRIVATE_KEY / GPG_PASSPHRASE (see publish-maven.yml):
// Gradle's ORG_GRADLE_PROJECT_* mapping truncates at the first newline, which turns
// an ascii-armored key into "-----BEGIN PGP PRIVATE KEY BLOCK-----" and fails with
// "Could not read PGP secret key" on :signMavenPublication.
// Version is injected via ARIA_VERSION (release tag sans leading v).
mavenPublishing {
    publishToMavenCentral(SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()

    coordinates('com.ariacompute', 'engine', project.version.toString())

    pom {
        name = 'Aria Engine'
        description = 'Kotlin/JVM + Android JNI binding for the Aria inference engine (libaria_ffi).'
        url = 'https://github.com/ariacompute/engine'
        licenses {
            license {
                name = 'MIT License'
                url = 'https://opensource.org/licenses/MIT'
            }
        }
        developers {
            developer {
                id = 'ariacompute'
                name = 'AriaCompute'
                url = 'https://github.com/ariacompute'
            }
        }
        scm {
            url = 'https://github.com/ariacompute/engine'
            connection = 'scm:git:git://github.com/ariacompute/engine.git'
            developerConnection = 'scm:git:ssh://git@github.com/ariacompute/engine.git'
        }
    }
}

def preparePgpKey(String raw) {
    String key = raw.replace('\\n', '\n').replace('\r\n', '\n').trim()
    if (key.contains('-----BEGIN PGP')) {
        return key
    }
    // vanniktech 0.30 kdoc format: armor headers/newlines already stripped.
    String body = key.replace('\n', '').trim()
    return "-----BEGIN PGP PRIVATE KEY BLOCK-----\n\n${body}\n-----END PGP PRIVATE KEY BLOCK-----\n"
}

def pgpKeyRaw = System.getenv('GPG_PRIVATE_KEY') ?: findProperty('signingInMemoryKey')
def pgpPassword = System.getenv('GPG_PASSPHRASE') ?: findProperty('signingInMemoryKeyPassword') ?: ''
if (pgpKeyRaw != null && pgpKeyRaw.toString().trim()) {
    signing.useInMemoryPgpKeys(preparePgpKey(pgpKeyRaw.toString()), pgpPassword.toString())
}

// `gradle build` (CI compile check) must not require a signatory.
tasks.withType(Sign).configureEach { signTask ->
    signTask.onlyIf {
        def key = System.getenv('GPG_PRIVATE_KEY') ?: findProperty('signingInMemoryKey')
        key != null && !key.toString().trim().isEmpty()
    }
}
