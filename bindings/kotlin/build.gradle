plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.ariacompute'
version = System.getenv('ARIA_VERSION') ?: '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifactId = 'engine'
        }
    }
}
