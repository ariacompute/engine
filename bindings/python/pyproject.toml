[project]
name = "ariaengine"
version = "0.1.0"
description = "Python SDK for Aria Engine (ctypes over libariaengine_ffi)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aria Compute" }]
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ariaengine*"]

[tool.setuptools.package-data]
ariaengine = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
# musl targets drop the cdylib crate type (crt-static default), so no
# libariaengine_ffi.so can be produced for musllinux containers; build manylinux only.
# NB: skip patterns match the FULL build identifier (e.g. cp310-musllinux_x86_64),
# so a leading "*" is required for a platform substring match.
skip = "*musllinux*"
archs = ["auto"]
test-command = "python -c \"from ariaengine import _load_lib; _load_lib(); print('ffi ok')\""
