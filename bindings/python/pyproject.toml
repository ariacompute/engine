[project]
name = "aria-engine"
version = "0.1.0"
description = "Python SDK for Aria Engine (ctypes over libaria_ffi)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aria Compute" }]
readme = "README.md"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aria_engine*"]

[tool.setuptools.package-data]
aria_engine = ["lib/*.so", "lib/*.dylib", "lib/*.dll"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
archs = ["auto"]
test-command = "python -c \"from aria_engine import _load_lib; _load_lib(); print('ffi ok')\""
